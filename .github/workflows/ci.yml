name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Branch protection on master requires a check named "test".
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Trivy
        # Installed from Trivy's own install script rather than the apt repo:
        # `apt-key` is gone on the current ubuntu-latest image (26.04), and the
        # apt repo publishes no suite for it, so both halves of the old recipe fail.
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
      - name: Run precommit checks
        env:
          RACE: "false"
        run: make precommit
